  <!-- Specular Reflection -->
  <ellipse cx="25" cy="18" rx="5" ry="8" transform="rotate(-25 25 18)" fill="#ffffff" opacity="0.6"/>
  <circle cx="28" cy="12" r="2" fill="#ffffff" opacity="0.75"/>
