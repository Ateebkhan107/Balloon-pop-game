<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POP RUSH - 2D Arcade Balloon Pop</title>
  <meta name="description" content="POP RUSH - Fast-paced, vibrant 2D balloon popping arcade game with speed combos, golden balloons, and intense Time Attack action!">
  <meta name="theme-color" content="#1e1b4b">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.svg">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="POP RUSH - Fast-Paced 2D Balloon Pop Arcade">
  <meta property="og:description" content="Pop target balloons, chain combos, trigger Fever Mode, and climb the family leaderboard in 4 exciting game modes!">
  <meta property="og:image" content="/assets/game.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="POP RUSH - Fast-Paced 2D Balloon Pop Arcade">
  <meta name="twitter:description" content="Pop target balloons, chain combos, trigger Fever Mode, and climb the family leaderboard in 4 exciting game modes!">
  <meta name="twitter:image" content="/assets/game.jpg">
  
  <!-- Modern playful typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      overscroll-behavior: none;
    }

    #game-container {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* 
      Critical: Override Phaser ScaleManager's inline margin additions.
      ScaleManager sets marginLeft/marginTop based on parent size, which when combined
      with CSS flex centering doubles the offset and pushes the canvas to the right.
      Setting margin: 0 !important lets flexbox center the canvas perfectly on all viewports.
    */
    #game-container canvas {
      display: block;
      margin: 0 !important;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      touch-action: none;
    }

    @media (max-width: 768px) {
      #game-container canvas {
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Fallback loading indicator */
    #loading-screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 100;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #f43f5e;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fb7185;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <noscript>
    <div style="position:fixed;inset:0;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;z-index:9999;">
      <h1 style="font-size:2rem;color:#f43f5e;margin-bottom:12px;">JavaScript Required</h1>
      <p style="font-size:1.1rem;color:#94a3b8;max-width:400px;line-height:1.5;">POP RUSH requires JavaScript to run. Please enable JavaScript in your browser settings to play.</p>
    </div>
  </noscript>
  <div id="game-container">
    <div id="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">Loading POP RUSH...</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
